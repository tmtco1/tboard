name: Debian Package

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            fakeroot \
            qt5-qmake \
            qtbase5-dev \
            qtdeclarative5-dev \
            libqt5svg5-dev \
            libqt5x11extras5-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxkbfile-dev \
            libxtst-dev

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: List packages
        run: |
          ls -lh ../*.deb

      - name: Upload Debian package
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ../*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
